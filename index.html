<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AI CAD Evaluator</title>
        <link rel="icon" href="/favicon.png" type="image/x-icon">

        <link rel="stylesheet" href="style.css"> 
        <script type="importmap">
          {
            "imports": {
              "three": "/node_modules/three/build/three.module.js",
              "three/addons/": "/node_modules/three/examples/jsm/"
            
            }
          }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>

    <body>
        
        <div id="scene-container"></div>

        <center><h1 id="Droptext" style="color:rgb(255, 255, 255); font-family: monospace;">3D Viewer</h1></center>
       
        <label for="file-input" class="upload-box">
            <svg class="dashed-border" viewBox="0 0 460 170" preserveAspectRatio="none">
                <rect
                  x="4"
                  y="4"
                  width="452"
                  height="162"
                  rx="32"
                  fill="none"
                  stroke="#c9cacd"
                  stroke-width="6"
                  stroke-dasharray="12 12"
                  stroke-linecap="round"
                />
              </svg>
            <strong style="font-family: monospace; font-size: large; color: rgb(199, 210, 255);">Upload any .STL file here</strong>
           
            <span style="font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif; color: rgb(199, 210, 255);">Click to browse</span>
            <input id="file-input" type="file" accept=".STL, .3mf" hidden>

        </label>

        <input type="text" class="inputfield" placeholder="What should I look for?">
        
        <button id="enterbutton" style="color: white; font-family: monospace;" disabled>Submit</button>

        <div id="output-container">
            <p id="ai-status"></p>
            <div id="ai-overview"></div>
        </div>

        <script src="main.js" type="module" defer></script>
</body>
</html>

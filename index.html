<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>AI CAD Evaluator</title>
        <link rel="icon" href="/favicon.png" type="image/x-icon">

        <link rel="stylesheet" href="style.css"> 
        <script type="importmap">
          {
            "imports": {
              "three": "/node_modules/three/build/three.module.js",
              "three/addons/": "/node_modules/three/examples/jsm/"
            
            }
          }
        </script>
        <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    </head>

    <body>
        
        <div id="scene-container"></div>

        <button id="reload">New Model</button>

        <center><h1 id="Droptext" style="color:rgb(255, 255, 255); font-family: monospace;">3D Viewer</h1></center>
       
        <label for="file-input" class="upload-box">
          <svg class="dashed-border" viewBox="0 0 370 130" preserveAspectRatio="none">
            <rect x="2" y="2" width="366" height="126" rx="20" fill="none" stroke="#2d3248" stroke-width="2" stroke-dasharray="8 8"/>
          </svg>
          
          <!-- Upload Icon -->
          <svg class="upload-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#00d4ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
        
          <div class="upload-text">
            <strong class="upload-title">Upload your <span class="highlight">.STL</span> file here</strong>
            <span class="upload-subtitle">click to browse local files</span>
          </div>
        
          <input id="file-input" type="file" accept=".stl, .3mf" hidden>
        </label>
        <input type="text" class="inputfield" placeholder="What should I look for?">
        
        <button id="enterbutton" style="color: white; font-family: monospace;" disabled>Submit</button>

        <div id="output-container">
            <p id="ai-status"></p>
            <div id="ai-overview"></div>
        </div>

        <script src="main.js" type="module" defer></script>
</body>
</html>
